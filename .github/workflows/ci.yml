name: EventHub CI/CD Enterprise Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Backend Quality Gates: Unit, Integration & Security Tests + PIT Mutation
  # =========================================================================
  backend-test:
    name: Backend Quality Gate (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests (100% Green Suite)
        working-directory: backend
        run: mvn clean test --batch-mode

      - name: Run PIT Mutation Testing Quality Gate
        working-directory: backend
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage --batch-mode

      - name: Build Deployable Spring Boot JAR Artifact
        working-directory: backend
        run: mvn package -DskipTests --batch-mode

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventhub-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # =========================================================================
  # 2. Frontend Quality Gates: Angular 17 Compilation & Static Asset Build
  # =========================================================================
  frontend-build:
    name: Frontend Quality Gate (Angular 17 / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile and Bundle Angular Production Build
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventhub-frontend-dist
          path: frontend/dist/eventhub-frontend/
          retention-days: 7

  # =========================================================================
  # 3. End-to-End Test Suite: Playwright Headless Browser Smoke & Ingestion
  # =========================================================================
  e2e-testing:
    name: End-to-End Suite (Playwright & Full Stack)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: eventhub-backend-jar
          path: backend/target

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: eventhub-frontend-dist
          path: frontend/dist/eventhub-frontend

      - name: Start Full Docker Compose Infrastructure
        run: docker compose up -d --build

      - name: Wait for Backend Health Readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8082/actuator/health | grep '"status":"UP"'; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Install Playwright Browsers and System Dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Test Suite (All 17 Tests)
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
