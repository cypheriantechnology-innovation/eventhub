<mat-toolbar class="navbar">
  <div class="nav-inner">
    <!-- Brand / Logo -->
    <div class="brand">
      <div class="logo-wrapper">
        <!-- High-Impact Pulse / Hexagon SVG Logo -->
        <svg class="brand-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logotipo EventHub Enterprise">
          <defs>
            <linearGradient id="logoPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="50%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#10b981" />
            </linearGradient>
          </defs>
          <polygon points="18,3 31,10 31,26 18,33 5,26 5,10" stroke="url(#logoPulseGrad)" stroke-width="2.2" fill="#0f172a" fill-opacity="0.8" />
          <path d="M10 18 L14 18 L17 12 L20 24 L23 15 L25 18 L27 18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="ecg-pulse-anim" />
        </svg>
      </div>

      <div class="brand-text">
        <div class="brand-heading">
          <span class="title">EventHub</span>
          <span class="edition-badge">ENTERPRISE</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs matching mockup -->
    <nav class="nav-menu">
      <a class="nav-tab active">
        <span>Dashboard</span>
        <span class="tab-indicator"></span>
      </a>
      <a class="nav-tab" (click)="scrollTo('pipelines-overview')">
        <span>Pipelines</span>
      </a>
      <a class="nav-tab" (click)="scrollTo('ingestion-section')">
        <span>Ingestion</span>
      </a>
      <a class="nav-tab" (click)="scrollTo('stream-section')">
        <span>Logs</span>
      </a>
      <a class="nav-tab" (click)="openActuator()">
        <span>Settings</span>
      </a>
      <a class="nav-tab nav-tab-dropdown" (click)="openSwagger()">
        <span>Admin</span>
        <mat-icon class="tab-chevron">expand_more</mat-icon>
      </a>
    </nav>

    <span class="spacer"></span>

    <!-- Right Utility Actions -->
    <div class="nav-actions">
      <!-- Status Beacon -->
      <div class="status-indicator" role="status" aria-label="Status do sistema: 100% operacional">
        <span class="status-beacon">
          <span class="beacon-wave"></span>
          <span class="beacon-dot"></span>
        </span>
        <div class="status-labels">
          <span class="status-name">HEXAGONAL CORE</span>
          <span class="status-state">100% OPERACIONAL</span>
        </div>
      </div>

      <div class="action-divider"></div>

      <!-- Quick Links -->
      <button mat-icon-button class="nav-icon-btn action-btn" (click)="openSwagger()" aria-label="Abrir Documentação Swagger API" matTooltip="Swagger API Docs">
        <mat-icon>api</mat-icon>
      </button>

      <button mat-icon-button class="nav-icon-btn action-btn" (click)="openActuator()" aria-label="Abrir Actuator Health Check" matTooltip="Spring Actuator Health">
        <mat-icon>monitor_heart</mat-icon>
      </button>

      <!-- Settings Icon -->
      <button mat-icon-button class="nav-icon-btn" aria-label="Configurações">
        <mat-icon>settings</mat-icon>
      </button>

      <!-- Notifications Icon with Indicator -->
      <button mat-icon-button class="nav-icon-btn notif-btn" aria-label="Notificações">
        <mat-icon>notifications</mat-icon>
        <span class="notif-badge"></span>
      </button>

      <!-- User Profile Avatar -->
      <div class="user-avatar-pill" title="Operador Logado: Admin (Secured)">
        <mat-icon class="avatar-icon">account_circle</mat-icon>
      </div>

      <!-- Mobile Menu Toggle Button (Visible < 992px) -->
      <button mat-icon-button class="nav-icon-btn mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Abrir Menu de Navegação" [attr.aria-expanded]="isMobileMenuOpen">
        <mat-icon>{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>

<!-- Collapsible Mobile Navigation Drawer (< 992px) -->
<nav class="mobile-drawer" *ngIf="isMobileMenuOpen" aria-label="Menu Mobile de Navegação">
  <div class="mobile-drawer-inner">
    <a class="mobile-nav-link" (click)="scrollTo('pipelines-overview')">
      <mat-icon>dashboard</mat-icon>
      <span>Pipelines Overview</span>
    </a>
    <a class="mobile-nav-link" (click)="scrollTo('ingestion-section')">
      <mat-icon>input</mat-icon>
      <span>Event Ingestion</span>
    </a>
    <a class="mobile-nav-link" (click)="scrollTo('stream-section')">
      <mat-icon>stream</mat-icon>
      <span>Real-time Stream & Logs</span>
    </a>
    <div class="mobile-divider"></div>
    <a class="mobile-nav-link" (click)="openSwagger()">
      <mat-icon>api</mat-icon>
      <span>Swagger API Docs</span>
    </a>
    <a class="mobile-nav-link" (click)="openActuator()">
      <mat-icon>monitor_heart</mat-icon>
      <span>Spring Actuator Health</span>
    </a>
  </div>
</nav>
