<div class="section-block">
  <div class="section-header">
    <h2 class="section-title">Industrial Event Ingestion</h2>
    <span class="section-meta">Inbound Port & Idempotência</span>
  </div>

  <div class="form-card">
    <div class="card-inner-header">
      <div class="header-left">
        <span class="card-title">Ingest New Data Source / Event</span>
        <span class="card-desc">Validação de esquema, deduplicação por chave única e roteamento OCP</span>
      </div>

      <!-- Quick sample actions -->
      <div class="sample-actions">
        <button mat-button type="button" class="btn-sample btn-sample-prd" (click)="generateSampleEvent('PRODUCTION')">
          <mat-icon>precision_manufacturing</mat-icon> Produção
        </button>
        <button mat-button type="button" class="btn-sample btn-sample-qlt" (click)="generateSampleEvent('QUALITY')">
          <mat-icon>verified_user</mat-icon> Qualidade
        </button>
      </div>
    </div>

    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="horizontal-form-grid">
      <!-- Col 1: Data Source Name / eventId -->
      <div class="form-col col-id">
        <label class="form-label" for="eventIdInput">Data Source Name / ID <span class="req">*</span></label>
        <mat-form-field appearance="outline" class="clean-field">
          <input matInput id="eventIdInput" formControlName="eventId" placeholder="Ex: EVT-PRD-4091" required autocomplete="off">
          <mat-error *ngIf="eventForm.get('eventId')?.hasError('required')">
            O identificador do evento é obrigatório.
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Col 2: Data Type / eventType -->
      <div class="form-col col-type">
        <label class="form-label">Data Type / Strategy <span class="req">*</span></label>
        <mat-form-field appearance="outline" class="clean-field">
          <mat-select formControlName="eventType" required>
            <mat-option value="PRODUCTION">PRODUCTION (Operação)</mat-option>
            <mat-option value="QUALITY">QUALITY (Auditoria)</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Col 3: API Endpoint / Description -->
      <div class="form-col col-desc">
        <label class="form-label" for="descInput">API Endpoint / Descrição <span class="req">*</span></label>
        <mat-form-field appearance="outline" class="clean-field">
          <textarea matInput id="descInput" formControlName="description" rows="1" placeholder="Descreva os dados do sensor ou rota industrial..." required></textarea>
          <mat-error *ngIf="eventForm.get('description')?.hasError('required')">
            A descrição da ocorrência é obrigatória.
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Actions: Batch CSV Upload + Add Source / Submit -->
      <div class="form-col col-actions">
        <input type="file" #fileInput id="batchFileInput" (change)="onFileSelected($event)" accept=".csv,.json" style="display:none">
        
        <button mat-button type="button" class="btn-upload-csv btn-sample-batch" (click)="fileInput.click()" [disabled]="isUploading">
          <mat-spinner *ngIf="isUploading" diameter="16" class="btn-spinner"></mat-spinner>
          <mat-icon *ngIf="!isUploading">cloud_upload</mat-icon>
          <span>{{ isUploading ? 'Enviando...' : 'Upload CSV' }}</span>
        </button>

        <button mat-flat-button color="primary" type="submit" class="btn-add-source submit-action-btn" [disabled]="isSubmitting">
          <mat-spinner *ngIf="isSubmitting" diameter="16" class="btn-spinner"></mat-spinner>
          <mat-icon *ngIf="!isSubmitting">add</mat-icon>
          <span>{{ isSubmitting ? 'Processando...' : 'Add Source' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
